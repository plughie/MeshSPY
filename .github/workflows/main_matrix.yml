name: MeshSPY CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meshspy-ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  t-deck-tft:
    name: Build T-Deck Plus firmware
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade platformio==6.2.0 scons==4.11.1
          python - <<'PY'
          import SCons.Tool.FortranCommon
          print("SCons.Tool.FortranCommon is available")
          PY

      - name: Resolve PlatformIO packages
        run: |
          pio pkg install -e t-deck-tft || true
          test -f "$HOME/.platformio/packages/tool-scons/scons-local-4.11.1/SCons/Tool/FortranCommon.py"

      - name: Build t-deck-tft
        run: |
          SCONS_LIB_DIR="$HOME/.platformio/packages/tool-scons/scons-local-4.11.1" \
            pio run -e t-deck-tft

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: meshspy-t-deck-tft-${{ github.sha }}
          if-no-files-found: error
          path: |
            .pio/build/t-deck-tft/firmware-t-deck-tft-*.bin
            .pio/build/t-deck-tft/littlefs-t-deck-tft-*.bin

  ci-gate:
    name: MeshSPY CI gate
    if: always()
    needs: [t-deck-tft]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the T-Deck build to pass
        env:
          BUILD_RESULT: ${{ needs.t-deck-tft.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "T-Deck build result: $BUILD_RESULT"
            exit 1
          fi
          echo "MeshSPY T-Deck build passed."
